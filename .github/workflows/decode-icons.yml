name: Decode icons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  decode:
    if: github.event.head_commit.message != 'Voeg gedecodeerde PWA-iconen toe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 icons to PNG
        run: |
          python3 - << 'PY'
          from pathlib import Path
          import base64
          root = Path("assets")
          found = False
          for p in sorted(root.glob("*.png.b64")):
              out = root / p.name[:-4]
              out.write_bytes(base64.b64decode(p.read_text().encode("ascii")))
              print("wrote", out, out.stat().st_size)
              found = True
          if not found:
              raise SystemExit("no b64 icons found")
          PY
      - name: Commit PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png
          if git diff --cached --quiet; then
            echo "No PNG changes"
          else
            git commit -m "Voeg gedecodeerde PWA-iconen toe"
            git push
          fi
