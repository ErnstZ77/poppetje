<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8F9FD">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Een interactief EJZ-poppetje voor op je iPhone-beginscherm.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Poppetje">
  <meta name="format-detection" content="telephone=no">
  <meta name="poppetje-version" content="v9-live">
  <title>EJZ Poppetje</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <p class="kicker">EJZ</p>
      <h1>poppetje</h1>
    </header>

    <main class="stage" id="stage">
      <div class="bubbles" id="bubbles" aria-live="polite"></div>

      <div class="mascot" id="mascot" role="img" aria-label="EJZ-poppetje. Tik, veeg of houd vast.">
        <div class="shadow" id="shadow"></div>
        <svg class="character" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          <g id="char" transform="rotate(-8 100 108)">
            <circle id="head" cx="100" cy="108" r="62" fill="#000000"/>
            <g id="phones">
              <path class="band-arc" d="M 30.46 82.69 A 74 74 0 0 1 169.54 82.69" fill="none" stroke="#3F8C66" stroke-width="14" stroke-linecap="round"/>
              <rect id="cup-l" x="16" y="86" width="28" height="52" rx="14" fill="#3F8C66"/>
              <rect id="cup-r" x="156" y="86" width="28" height="52" rx="14" fill="#3F8C66"/>
              <g id="mic-arm">
                <path d="M 36 128 Q 44 144 63 143" fill="none" stroke="#3F8C66" stroke-width="6" stroke-linecap="round"/>
                <rect id="mic-tip" x="52" y="136" width="22" height="14" rx="7" fill="#3F8C66"/>
              </g>
            </g>
            <g id="face">
              <g transform="rotate(8 103.5 105)"><rect id="eye-l" x="96" y="90" width="15" height="30" rx="7.5" fill="#ffffff"/></g>
              <g transform="rotate(8 131.5 105)"><rect id="eye-r" x="124" y="90" width="15" height="30" rx="7.5" fill="#ffffff"/></g>
            </g>
          </g>
        </svg>
      </div>
    </main>

    <div class="results" id="results" hidden></div>

    <p class="hint" id="hint">tik · veeg · houd vast · kantel · praat</p>

    <form class="search" id="search-form" action="#" method="get">
      <label class="sr-only" for="q">Zoeken of een vraag stellen</label>
      <input id="q" name="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Zoek of typ een vraag" maxlength="200">
      <button type="button" class="mic-btn" id="mic-btn" aria-label="Praten" aria-pressed="false" title="Praat met het poppetje">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2z"/>
        </svg>
      </button>
      <button type="submit" class="go" aria-label="Zoeken">Zoek</button>
    </form>
    <p class="listen-status" id="listen-status" hidden>luistert…</p>
    <p class="voice-hint" id="voice-hint" hidden></p>

    <details class="settings" id="settings">
      <summary>Instellingen</summary>
      <label class="settings-label" for="shortcut-name">Opdracht-naam</label>
      <input id="shortcut-name" type="text" maxlength="80" placeholder="Speel Spotify" autocomplete="off" spellcheck="false" enterkeyhint="done">
      <p class="settings-help">Vul hier de exacte naam van je opdracht in Opdrachten in als je wilt dat Spotify muziek start. De stappen staan in de README.</p>
      <label class="settings-check">
        <input type="checkbox" id="voice-debug">
        Toon spraakdetails
      </label>
      <pre class="voice-debug" id="voice-debug-log" hidden></pre>
    </details>

    <button type="button" class="tap-continue" id="tap-continue" hidden><span class="tap-continue-icon" aria-hidden="true">🎙️</span><span>Tik om verder te praten</span></button>

    <button type="button" class="tilt-btn" id="tilt-btn" hidden>Kantelen aanzetten</button>
  </div>

  <script src="assets/anime.min.js"></script>
  <script src="assets/engine.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
